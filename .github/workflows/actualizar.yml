name: Actualizar el sismógrafo

on:
  workflow_dispatch:        # botón «Run workflow»: actualización con un clic
  schedule:
    - cron: '17 9 3 * *'    # el día 3 de cada mes, 09:17 UTC
  push:
    branches: [main]
    paths: ['sismografo/**', 'site/*.html', 'site/*.js', 'site/*.css', 'run.py', 'requirements.txt']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sismografo
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar datos y recalcular el multiverso
        run: python run.py
      - name: Guardar los resultados versionados
        run: |
          git config user.name "sismografo-bot"
          git config user.email "sismografo-bot@users.noreply.github.com"
          git add resultados site/data site/descargas
          if git diff --cached --quiet; then echo "Sin cambios en los datos"; else
            git commit -m "Actualización automática de datos ($(date -u +%Y-%m-%d))" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: calcular
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
